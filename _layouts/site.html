---
layout: compress
---
<!doctype html>
<html lang="{{ site.locale | slice: 0, 2 }}" class="no-js">
<head>
  <script>
    (function(){
      var key = 'theme';
      function readCookie() {
        var match = document.cookie.match(new RegExp('(?:^|; )' + key + '=([^;]*)'));
        return match ? decodeURIComponent(match[1]) : null;
      }
      function valid(value) {
        return value === 'dark' || value === 'light';
      }
      try {
        var stored = null;
        try { stored = localStorage.getItem(key); } catch(e){}
        if (!valid(stored)) stored = readCookie();
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = valid(stored) ? stored : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch(e){}
    })();
  </script>
  <meta charset="utf-8">
  {% include seo.html %}
  <meta name="google-site-verification" content="dikVNuX5ozgfNg-eizSWcu5vsDIsa8StllWfR96NYw8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="HandheldFriendly" content="True">
  <meta name="MobileOptimized" content="320">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <link href="{{ '/feed.xml' | relative_url }}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
  {% include site/style.html %}
  <meta name="view-transition" content="same-origin">
  <style>
    /* fade page-load and page-leave */
    @keyframes v3-fade-in  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes v3-fade-out { from { opacity: 1; } to { opacity: 0; transform: translateY(-4px); } }
    main { animation: v3-fade-in .7s cubic-bezier(.2,.7,.2,1) both; }
    body.is-leaving main { animation: v3-fade-out .45s ease forwards; }

    /* native View Transitions where supported */
    @media (prefers-reduced-motion: no-preference) {
      ::view-transition-old(root) { animation: v3-fade-out .45s ease both; }
      ::view-transition-new(root) { animation: v3-fade-in  .7s cubic-bezier(.2,.7,.2,1) both; }
    }
    @media (prefers-reduced-motion: reduce) {
      main, body.is-leaving main { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="site-layout">
    {% include site/rail.html %}
    <main>{{ content }}</main>
  </div>
  {% include site/foot.html %}
  <script>
    (function(){
      var key = 'theme';
      function valid(value) {
        return value === 'dark' || value === 'light';
      }
      function persist(theme) {
        try { localStorage.setItem(key, theme); } catch(e){}
        try { document.cookie = key + '=' + encodeURIComponent(theme) + ';path=/;max-age=31536000;SameSite=Lax'; } catch(e){}
      }
      function apply(theme) {
        if (!valid(theme)) return;
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        persist(theme);
      }
      document.addEventListener('click', function(e){
        var toggle = e.target.closest && e.target.closest('.theme-toggle');
        if (!toggle) return;
        var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        apply(current === 'dark' ? 'light' : 'dark');
      });
      window.addEventListener('storage', function(e){
        if (e.key === key && valid(e.newValue)) apply(e.newValue);
      });
    })();
  </script>
  <script>
    (function(){
      var supportsVT = !!document.startViewTransition;
      function sameOrigin(url){
        try { var u = new URL(url, location.href); return u.origin === location.origin; } catch(e){ return false; }
      }
      document.addEventListener('click', function(e){
        var a = e.target.closest && e.target.closest('a');
        if (!a) return;
        var href = a.getAttribute('href');
        if (!href || href[0] === '#') return;
        if (a.target && a.target !== '' && a.target !== '_self') return;
        if (a.hasAttribute('download')) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        if (!sameOrigin(a.href)) return;
        // skip PDFs (browser handles)
        if (/\.(pdf|zip|png|jpg|jpeg|gif|svg)$/i.test(a.pathname)) return;
        if (supportsVT) return; // browser handles via meta + ::view-transition
        e.preventDefault();
        document.body.classList.add('is-leaving');
        setTimeout(function(){ window.location.href = a.href; }, 380);
      }, false);
      // restore on bfcache return
      window.addEventListener('pageshow', function(){ document.body.classList.remove('is-leaving'); });
    })();
  </script>
</body>
</html>
