---
layout: site
---
{% include base_path %}
<div class="v3-wrap">
  {% if page.title %}
  <div class="v3-page-head">
    {% if page.eyebrow %}<p class="v3-page-eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="v3-page-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="v3-page-sub">{{ page.subtitle }}</p>{% endif %}
  </div>
  {% endif %}
  <div class="v3-prose">{{ content }}</div>
</div>
