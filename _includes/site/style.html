<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#111;
    --muted:#5b5b5b;
    --rule:#e3e3e3;
    --paper:#ffffff;
    --panel:#ffffff;
    --accent:#1c4fd4;
    --accent-rule:rgba(28,79,212,0.28);
    --soft:#f3f4f7;
    --tag:#eef2fb;
    --on-ink:#ffffff;
    --portrait-bg:#eeeeee;
    --portrait-shadow:0 18px 40px -18px rgba(0,0,0,0.35), 0 6px 14px -6px rgba(0,0,0,0.15);
    --portrait-shadow-hover:0 22px 50px -18px rgba(0,0,0,0.4), 0 8px 16px -6px rgba(0,0,0,0.18);
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --ink:#f0f2f5;
    --muted:#aeb6c4;
    --rule:#363d49;
    --paper:#12151a;
    --panel:#1a1f28;
    --accent:#8fb1ff;
    --accent-rule:rgba(143,177,255,0.42);
    --soft:#222835;
    --tag:#222b3a;
    --on-ink:#12151a;
    --portrait-bg:#1a1f28;
    --portrait-shadow:0 18px 44px -18px rgba(0,0,0,0.7), 0 6px 16px -8px rgba(0,0,0,0.5);
    --portrait-shadow-hover:0 24px 58px -18px rgba(0,0,0,0.76), 0 8px 18px -8px rgba(0,0,0,0.56);
    color-scheme: dark;
  }
  html[data-theme="dark"] .site-nav { background:rgba(14,15,18,0.88); }
  html[data-theme="dark"] .site-layout,
  html[data-theme="dark"] .site-layout > main,
  html[data-theme="dark"] .v3-wrap { background:var(--paper); color:var(--ink); }
  html[data-theme="dark"] img { opacity:0.92; }
  html[data-theme="dark"] body,
  html[data-theme="dark"] .v3-prose,
  html[data-theme="dark"] .v3-prose p,
  html[data-theme="dark"] .v3-prose li,
  html[data-theme="dark"] .v3-prose strong,
  html[data-theme="dark"] .v3-name,
  html[data-theme="dark"] .v3-page-title,
  html[data-theme="dark"] .v3-title,
  html[data-theme="dark"] .v3-title a,
  html[data-theme="dark"] .v3-pin h3,
  html[data-theme="dark"] .site-nav-inner a.brand { color: var(--ink) !important; }
  html[data-theme="dark"] .v3-prose h2,
  html[data-theme="dark"] .v3-prose h3,
  html[data-theme="dark"] .v3-prose h4 { color: var(--ink) !important; }
  html[data-theme="dark"] .v3-role,
  html[data-theme="dark"] .v3-blurb,
  html[data-theme="dark"] .v3-meta,
  html[data-theme="dark"] .site-nav-links a { color: var(--muted) !important; }
  /* dark fixes: chips, callouts, pinned cards, CV v2 page */
  html[data-theme="dark"] .v3-chip,
  html[data-theme="dark"] .home-chip,
  html[data-theme="dark"] .proj-card .chip { background:var(--soft) !important; color:var(--ink) !important; }
  html[data-theme="dark"] .v3-pin,
  html[data-theme="dark"] .proj-card { background:var(--panel) !important; border-color:var(--rule) !important; }
  html[data-theme="dark"] .v3-pin .v3-tag,
  html[data-theme="dark"] .proj-card .kind { color:var(--accent) !important; }
  /* paper-GPT callout */
  html[data-theme="dark"] .v3-prose div[style*="border-left"] { background:var(--soft) !important; border-color:var(--rule) !important; }
  html[data-theme="dark"] .v3-prose div[style*="border-left"] p,
  html[data-theme="dark"] .v3-prose div[style*="border-left"] li,
  html[data-theme="dark"] .v3-prose div[style*="border-left"] h3 { color:var(--ink) !important; }
  html[data-theme="dark"] .v3-prose a[style*="background:#fff"],
  html[data-theme="dark"] .v3-prose a[style*="background:var(--ink)"] { background:var(--ink) !important; color:var(--on-ink) !important; border-color:var(--ink) !important; }
  /* CV v2 page */
  html[data-theme="dark"] .cv2-wrap { color:var(--ink) !important; }
  html[data-theme="dark"] .cv2-side h1 { color:var(--ink) !important; }
  html[data-theme="dark"] .cv2-side .ctas a { background:var(--soft) !important; color:var(--ink) !important; border-color:var(--rule) !important; }
  html[data-theme="dark"] .cv2-side .ctas a.primary { background:var(--ink) !important; color:var(--on-ink) !important; border-color:var(--ink) !important; }
  html[data-theme="dark"] .cv2-side nav.toc { background:var(--panel) !important; border:1px solid var(--rule); border-radius:8px; padding:8px 4px; }
  html[data-theme="dark"] .cv2-side nav.toc a { color:var(--muted) !important; }
  html[data-theme="dark"] .cv2-side nav.toc a:hover { color:var(--ink) !important; }
  html[data-theme="dark"] .cv2-main section { border-bottom-color:var(--rule) !important; }
  html[data-theme="dark"] .cv2-main h2 { color:var(--ink) !important; }
  html[data-theme="dark"] .cv2-main ul,
  html[data-theme="dark"] .cv2-main li,
  html[data-theme="dark"] .cv2-main p,
  html[data-theme="dark"] .cv2-main header { color:var(--ink) !important; }
  html[data-theme="dark"] .cv2-main header .when { color:var(--muted) !important; }
  /* blog tag chips inline */
  html[data-theme="dark"] .v3-skills .v3-chip { background:var(--soft) !important; color:var(--ink) !important; }
  /* CV education w/ logo */
  .cv-edu { display:grid; grid-template-columns:56px 1fr; gap:16px; align-items:start; }
  .cv-logo { width:56px; height:56px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; background:var(--soft); border:1px solid var(--rule); font-family:'Inter', sans-serif; font-weight:700; font-size:14px; letter-spacing:0.05em; color:var(--ink); flex:none; overflow:hidden; }
  .cv-logo-img { object-fit:contain; padding:6px; background:#fff; }
  .cv-logo-ucsd { background:#182B49; color:#FFCD00; }
  html[data-theme="dark"] .cv-logo-img { background:#fff; }
  @media (max-width:520px){ .cv-edu { grid-template-columns:1fr; } .cv-logo { width:42px; height:42px; font-size:12px; } }
  /* generic dark override for hardcoded #fff backgrounds */
  html[data-theme="dark"] [style*="background:#fff"] { background:var(--soft) !important; }
  html[data-theme="dark"] [style*="background:var(--ink)"] { color:var(--on-ink) !important; }
  html[data-theme="dark"] .site-nav-links a:hover,
  html[data-theme="dark"] .site-nav-links a.active { color: var(--ink) !important; }
  /* theme toggle */
  .theme-toggle { background:none; border:1px solid var(--rule); border-radius:999px; width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); margin-left:14px; padding:0; transition:background .2s, border-color .2s; }
  .theme-toggle:hover { border-color:var(--ink); background:var(--soft); }
  .theme-toggle svg { width:16px; height:16px; }
  .theme-toggle .icon-sun { display:none; }
  html[data-theme="dark"] .theme-toggle .icon-sun  { display:inline; }
  html[data-theme="dark"] .theme-toggle .icon-moon { display:none; }
  html,body { background:var(--paper); color:var(--ink); }
  body { font-family:'Inter', system-ui, sans-serif; font-size:16px; line-height:1.62; margin:0; }
  *, *::before, *::after { box-sizing:border-box; }

  /* --- V3 chrome --- */
  .site-nav { position:sticky; top:0; z-index:50; background:rgba(255,255,255,0.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--rule); }
  .site-nav-inner { max-width:1080px; margin:0 auto; padding:14px 32px; display:flex; justify-content:space-between; align-items:center; }
  .site-nav-inner a.brand { font-family:'Source Serif 4', serif; font-size:19px; font-weight:600; color:var(--ink); text-decoration:none; letter-spacing:0; }
  .site-nav-links a { color:var(--muted); margin-left:22px; text-decoration:none; font-size:15px; font-weight:500; }
  .site-nav-links a:hover, .site-nav-links a.active { color:var(--ink); }
  .site-nav-cta { display:inline-block; margin-left:22px; padding:7px 12px; border:1px solid var(--ink); border-radius:6px; color:var(--ink); font-size:14px; text-decoration:none; font-weight:500; }
  .site-nav-cta:hover { background:var(--ink); color:var(--on-ink); }

  .v3-wrap { max-width:none; margin:0; padding:0; }
  .v3-wrap.narrow { max-width:760px; }

  /* --- page header --- */
  .v3-page-head { padding-bottom:24px; border-bottom:1px solid var(--rule); margin-bottom:36px; }
  .v3-page-eyebrow { font-family:'JetBrains Mono', monospace; font-size:13px; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); margin:0 0 8px; font-weight:500; }
  .v3-page-title { font-family:'Source Serif 4', serif; font-size:40px; font-weight:600; margin:0 0 8px; letter-spacing:0; line-height:1.1; }
  .v3-page-sub { color:var(--muted); margin:0; font-size:17px; max-width:700px; }

  /* --- home hero --- */
  .v3-top { display:grid; grid-template-columns:1fr auto; gap:24px; align-items:end; padding-bottom:24px; border-bottom:1px solid var(--rule); }
  .v3-name { font-family:'Source Serif 4', serif; font-size:38px; font-weight:600; margin:0 0 6px; letter-spacing:0; }
  .v3-role { color:var(--muted); margin:0; font-size:18px; max-width:660px; }
  .v3-cta { display:flex; gap:10px; flex-wrap:wrap; }
  .v3-btn { font-size:14px; font-weight:500; padding:10px 15px; border-radius:6px; text-decoration:none; border:1px solid var(--rule); color:var(--ink); background:var(--panel); }
  .v3-btn.primary { background:var(--ink); color:var(--on-ink); border-color:var(--ink); }
  .v3-btn:hover { border-color:var(--ink); }

  /* --- sections --- */
  .v3-section { margin-top:48px; }
  .v3-section h2.v3-h2 { font-family:'Source Serif 4', serif; font-size:14px; font-weight:600; text-transform:uppercase; letter-spacing:0.18em; color:var(--muted); margin:0 0 18px; }

  /* --- pinned cards --- */
  .v3-pinned { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .v3-pin { border:1px solid var(--rule); border-radius:10px; padding:18px; background:var(--panel); transition:transform .15s, border-color .15s; text-decoration:none; color:inherit; display:block; }
  .v3-pin:hover { transform:translateY(-2px); border-color:var(--ink); }
  .v3-pin .v3-tag { font-size:12px; font-family:'JetBrains Mono', monospace; color:var(--accent); text-transform:uppercase; letter-spacing:0.12em; font-weight:600; }
  .v3-pin { position:relative; }
  .v3-pin h3 { font-family:'Source Serif 4', serif; margin:8px 0 6px; font-size:19px; line-height:1.3; }
  .v3-pin p { margin:0 0 10px; color:var(--muted); font-size:15px; }
  .v3-pin .more { font-size:14px; color:var(--accent); text-decoration:none; font-weight:500; }
  /* card-wide click target (must coexist w/ inline links) */
  .v3-pin .stretched { position:absolute; inset:0; z-index:1; text-indent:-9999px; overflow:hidden; border-radius:inherit; }
  .v3-pin p a, .v3-pin .more { position:relative; z-index:2; }

  /* --- twocol layout --- */
  .v3-twocol { display:grid; grid-template-columns:1.2fr 1fr; gap:36px; }

  /* --- entry list (publications/talks/teaching) --- */
  .v3-list { list-style:none; padding:0; margin:0; }
  .v3-list > li { padding:18px 0; border-bottom:1px solid var(--rule); }
  .v3-list > li:last-child { border-bottom:0; }
  .v3-meta { font-size:13px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:0.1em; font-family:'JetBrains Mono', monospace; }
  .v3-title { font-family:'Source Serif 4', serif; font-size:22px; font-weight:600; margin:4px 0 6px; line-height:1.3; }
  .v3-title a { color:var(--ink); text-decoration:none; border-bottom:1px solid transparent; }
  .v3-title a:hover { border-bottom-color:var(--accent); color:var(--accent); }
  .v3-blurb { color:var(--muted); font-size:16px; margin:0; }
  .v3-actions { margin-top:8px; display:flex; gap:14px; flex-wrap:wrap; font-size:14px; }
  .v3-actions a { color:var(--accent); text-decoration:none; font-weight:500; }
  .v3-actions a:hover { text-decoration:underline; }

  /* --- blog archive and note resources --- */
  .v3-prose ul.v3-list { padding-left:0; }
  .v3-prose .blog-section-label {
    margin:0; padding:0; border:0; color:var(--muted);
    font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:600;
    line-height:1.4; letter-spacing:0.16em; text-transform:uppercase;
  }
  .blog-featured-section { margin:0 0 46px; }
  .blog-featured-section .blog-section-label { margin-bottom:14px; }
  .v3-prose .blog-featured {
    display:block; padding:26px 28px 24px; border:1px solid var(--rule); border-left:3px solid var(--accent);
    border-radius:12px; color:var(--ink);
    text-decoration:none; background:var(--panel); transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .v3-prose .blog-featured:hover { transform:translateY(-2px); border-color:var(--accent); box-shadow:0 16px 34px -28px rgba(0,0,0,.55); }
  .v3-prose .blog-featured:focus-visible,
  .v3-prose .blog-entry-card:focus-visible { outline:3px solid var(--accent-rule); outline-offset:4px; }
  .blog-featured-copy { display:flex; flex-direction:column; align-items:flex-start; min-width:0; max-width:690px; }
  .blog-featured-title { display:block; margin:8px 0 8px; font-family:'Source Serif 4', serif; font-size:30px; font-weight:600; line-height:1.2; }
  .blog-featured-blurb { display:block; max-width:660px; color:var(--muted); font-size:15px; line-height:1.62; }
  .blog-section-head { display:flex; justify-content:space-between; align-items:baseline; gap:18px; padding-bottom:12px; border-bottom:1px solid var(--rule); }
  .v3-prose .blog-section-head > a { flex:none; border:0; font-size:13px; font-weight:500; }
  .blog-entry-list > li { padding:0; }
  .v3-prose .blog-entry-card { display:block; padding:21px 0; color:inherit; text-decoration:none; border:0; }
  .blog-entry-card article { transition:transform .16s ease; }
  .blog-entry-card:hover article { transform:translateX(4px); }
  .blog-entry-card:hover .v3-title { color:var(--accent); }
  .blog-entry-card .v3-title { margin:6px 0 6px; transition:color .15s ease; }
  .blog-entry-card .v3-blurb { margin:0; }
  .blog-entry-topline { display:flex; align-items:center; flex-wrap:wrap; gap:0; color:var(--muted); font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; }
  .blog-entry-topline > * + *::before { content:'·'; margin:0 8px; color:var(--muted); }
  .blog-tag-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; }
  .blog-tag { display:inline-flex; padding:3px 8px; border-radius:999px; background:var(--tag); color:var(--muted); font-size:11px; font-weight:500; line-height:1.5; }
  .blog-read-link { display:inline-flex; margin-top:12px; color:var(--accent); font-size:13px; font-weight:600; }
  .blog-read-link span { margin-left:4px; transition:transform .15s ease; }
  .blog-featured:hover .blog-read-link span,
  .blog-entry-card:hover .blog-read-link span { transform:translateX(3px); }
  .blog-topics { margin-top:46px; }
  .blog-topics .blog-section-label { margin-bottom:14px; }
  .blog-subscribe {
    display:flex; align-items:center; gap:14px; margin-top:36px; padding:18px;
    border:1px solid var(--rule); border-radius:10px; background:var(--soft);
  }
  .blog-subscribe-icon { display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; flex:none; border-radius:9px; background:var(--panel); color:var(--accent); border:1px solid var(--rule); }
  .blog-subscribe-icon svg { width:19px; height:19px; }
  .blog-subscribe-copy { display:flex; flex-direction:column; min-width:0; flex:1; }
  .blog-subscribe-copy strong { color:var(--ink); font-size:14px; }
  .blog-subscribe-copy > span { color:var(--muted); font-size:13px; line-height:1.5; }
  .v3-prose .blog-subscribe .v3-btn { flex:none; border:1px solid var(--rule); color:var(--ink); }
  .notes-topic-list { margin:4px 0 30px; }
  .notes-library-list .v3-actions { margin-bottom:0; }
  .blog-resource-actions { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin:-12px 0 34px; }
  .blog-resource-button {
    display:inline-flex; align-items:center; gap:7px; margin:0; padding:10px 17px;
    border-radius:999px; box-shadow:0 9px 22px -16px rgba(0,0,0,.65);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .blog-resource-button:hover { transform:translateY(-1px); box-shadow:0 12px 26px -16px rgba(0,0,0,.72); }
  .blog-resource-arrow { transition:transform .16s ease; }
  .blog-resource-button:hover .blog-resource-arrow { transform:translate(2px,-2px); }
  .blog-corrections { margin-top:36px; padding:16px 18px; border-left:3px solid var(--accent); background:var(--soft); color:var(--muted); font-size:14px; line-height:1.6; }
  .blog-corrections strong { color:var(--ink); }
  .blog-corrections a { color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-rule); }
  .blog-editorial-card { max-width:680px; padding:28px; border:1px solid var(--rule); border-radius:12px; background:var(--panel); }
  .v3-prose .blog-editorial-card .blog-section-label { margin:0 0 12px; }
  .v3-prose .blog-editorial-card h2 { margin:0 0 12px; padding:0; border:0; font-size:26px; }
  .v3-prose .blog-editorial-card p { max-width:600px; color:var(--muted); }
  .v3-prose .blog-editorial-card .v3-btn { display:inline-flex; align-items:center; gap:7px; margin-top:8px; color:#fff; border:0; }

  /* --- skills/chips --- */
  .v3-skills { display:flex; flex-wrap:wrap; gap:8px; }
  .v3-chip { font-size:13px; padding:5px 10px; background:var(--soft); border-radius:999px; color:var(--ink); }

  /* --- prose (CV, longform) --- */
  .v3-prose { font-size:16px; line-height:1.68; color:var(--ink); }
  .v3-prose h2 { font-family:'Source Serif 4', serif; font-size:24px; font-weight:600; letter-spacing:0; margin:40px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--rule); }
  .v3-prose h3 { font-family:'Source Serif 4', serif; font-size:20px; font-weight:600; margin:28px 0 6px; }
  .v3-prose h4 { font-size:15px; font-weight:600; margin:18px 0 4px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); }
  .v3-prose p { margin:0 0 14px; }
  .v3-prose ul { padding-left:20px; margin:0 0 14px; }
  .v3-prose li { margin-bottom:6px; }
  .v3-prose a { color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-rule); }
  .v3-prose a:hover { border-bottom-color:var(--accent); }
  .v3-prose hr { border:0; border-top:1px solid var(--rule); margin:32px 0; }
  .v3-prose strong { color:var(--ink); font-weight:600; }
  .v3-prose code { font-family:'JetBrains Mono', monospace; font-size:15px; background:var(--soft); padding:1px 6px; border-radius:4px; }
  .v3-prose blockquote { border-left:3px solid var(--accent); padding:6px 0 6px 18px; margin:18px 0; color:var(--muted); font-style:italic; }
  .v3-prose img { max-width:100%; height:auto; border-radius:6px; }

  /* --- footer --- */
  .v3-site-foot { border-top:1px solid var(--rule); margin-top:80px; }
  .v3-site-foot-inner { max-width:1040px; margin:0 auto; padding:32px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px; font-size:14px; color:var(--muted); }
  .v3-site-foot a { color:var(--accent); text-decoration:none; }

  @media (max-width:780px){
    .v3-pinned{grid-template-columns:1fr;}
    .v3-twocol{grid-template-columns:1fr;}
    .v3-top{grid-template-columns:1fr;}
    .site-nav-inner{padding:12px 18px;}
    .site-nav-links a{margin-left:14px; font-size:14px;}
    .v3-wrap{padding:32px 18px 64px;}
    .v3-prose .blog-featured{padding:20px 21px 19px;}
    .blog-featured-title{font-size:25px;}
    .blog-section-head{align-items:flex-start; flex-direction:column; gap:6px;}
    .blog-subscribe{align-items:flex-start; flex-wrap:wrap;}
    .blog-subscribe-copy{min-width:200px;}
    .v3-prose .blog-subscribe .v3-btn{margin-left:52px;}
  }

  @media (max-width:460px){
    .blog-entry-topline{line-height:1.7;}
    .blog-entry-topline > * + *::before{margin:0 6px;}
    .v3-prose .blog-subscribe .v3-btn{margin-left:0; width:100%; text-align:center;}
  }

  /* ============================================
     GLOBAL LEFT RAIL — sitewide identity + nav
     ============================================ */
  .site-layout { display:grid; grid-template-columns:230px 1fr; gap:52px; max-width:none; margin:0; padding:28px 44px 88px 84px; align-items:start; }
  .site-layout > main { min-width:0; max-width:790px; }

  .rail { position:sticky; top:24px; display:flex; flex-direction:column; gap:16px; }
  .rail-portrait {
    display:block; width:176px; height:176px; border-radius:16px; overflow:hidden;
    box-shadow: var(--portrait-shadow);
    background:var(--portrait-bg); text-decoration:none;
    transition: transform .25s ease, box-shadow .25s ease;
  }
